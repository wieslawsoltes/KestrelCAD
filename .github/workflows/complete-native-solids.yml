name: Complete and verify native solids
on:
  push:
    branches: [feature/native-brep-solids]
    paths: ['.github/workflows/complete-native-solids.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: complete-native-solids
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/native-brep-solids
      - name: Complete the recovered integration without substituting mesh geometry
        run: |
          python3 - <<'PY'
          import ast, hashlib, pathlib, re
          root=pathlib.Path.cwd()
          required=['src/kernel.js','src/kernel-ui.js','tests/kernel.test.py','tests/kernel-client.test.js','tests/advanced.browser.py','docs/NATIVE-SOLIDS.md','requirements-kernel.txt']
          missing=[p for p in required if not (root/p).is_file()]
          if missing: raise SystemExit('Source recovery must finish first: '+', '.join(missing))
          native=root/'tools/kernel.py'
          if not native.exists():
              native.write_bytes((root/'tools/native-kernel-recovery.py').read_bytes())
          ast.parse(native.read_text())
          server=root/'tools/serve.py'
          text=server.read_text()
          if '/api/kernel' not in text:
              tree=ast.parse(text)
              handlers=[node.name for node in tree.body if isinstance(node,ast.ClassDef) and {'do_GET','do_POST'}.issubset({n.name for n in node.body if isinstance(n,ast.FunctionDef)})]
              if len(handlers)!=1: raise SystemExit('Could not identify the existing HTTP handler safely')
              guards=[node.lineno for node in tree.body if isinstance(node,ast.If) and '__name__' in ast.unparse(node.test)]
              if len(guards)!=1: raise SystemExit('Could not identify server entry point safely')
              extension=r'''
          # Optional native operations share the bridge's existing origin/host policy.
          import importlib.util as _native_importlib
          import json as _native_json
          import pathlib as _native_pathlib
          import subprocess as _native_subprocess
          import sys as _native_sys
          import tempfile as _native_tempfile
          import threading as _native_threading
          _native_lock = _native_threading.BoundedSemaphore(1)
          _native_capabilities_original = capabilities
          def capabilities(*args, **kwargs):
              result = _native_capabilities_original(*args, **kwargs)
              result.update(brep=bool(_native_importlib.find_spec('cadquery')), brepProvider='OpenCascade via CadQuery (not ACIS)')
              return result
          def _native_reply(handler, status, data):
              payload = _native_json.dumps(data, allow_nan=False).encode('utf-8')
              handler.send_response(status)
              handler.send_header('Content-Type', 'application/json; charset=utf-8')
              handler.send_header('Content-Length', str(len(payload)))
              handler.send_header('Cache-Control', 'no-store')
              handler.send_header('X-Content-Type-Options', 'nosniff')
              handler.end_headers()
              handler.wfile.write(payload)
          _native_original_post = HANDLER.do_POST
          def _native_post(self):
              if self.path.split('?', 1)[0] != '/api/kernel':
                  return _native_original_post(self)
              if not self.local_request(post=True): return
              if self.headers.get('Transfer-Encoding') or self.headers.get('Content-Type','').split(';',1)[0].strip() != 'application/json':
                  return _native_reply(self,400,{'error':'A non-chunked application/json body is required'})
              try: length = int(self.headers.get('Content-Length','0'))
              except ValueError: length = 0
              if not 1 <= length <= 64*1024*1024:
                  return _native_reply(self,413,{'error':'Request must contain 1 byte–64 MiB'})
              if not _native_lock.acquire(blocking=False):
                  return _native_reply(self,429,{'error':'A native operation is already running'})
              try:
                  self.connection.settimeout(20)
                  payload=self.rfile.read(length)
                  if len(payload)!=length or not isinstance(_native_json.loads(payload),dict):
                      raise ValueError('Incomplete or invalid JSON operation')
                  with _native_tempfile.TemporaryDirectory(prefix='kestrel-native-') as directory:
                      output=_native_pathlib.Path(directory)/'result.json'
                      log=_native_pathlib.Path(directory)/'worker.log'
                      worker=_native_pathlib.Path(__file__).resolve().parent/'kernel.py'
                      with output.open('wb') as stdout, log.open('wb') as stderr:
                          process=_native_subprocess.run([_native_sys.executable,str(worker)],input=payload,stdout=stdout,stderr=stderr,cwd=directory,timeout=60,shell=False)
                      if process.returncode!=0 or output.stat().st_size>64*1024*1024:
                          raise ValueError('Native worker failed or exceeded its output limit')
                      result=_native_json.loads(output.read_bytes())
                      if not isinstance(result,dict): raise ValueError('Invalid worker response')
                  return _native_reply(self,422 if 'error' in result else 200,result)
              except _native_subprocess.TimeoutExpired:
                  return _native_reply(self,504,{'error':'Native operation timed out'})
              except (OSError,ValueError) as error:
                  return _native_reply(self,422,{'error':str(error)[:2000]})
              finally:
                  _native_lock.release()
          HANDLER.do_POST = _native_post
          '''.replace('HANDLER',handlers[0])
              lines=text.splitlines(keepends=True)
              lines.insert(guards[0]-1,extension+'\n')
              server.write_text(''.join(lines))
          ast.parse(server.read_text())
          index=root/'index.html'
          text=index.read_text()
          if 'src/kernel.js' not in text:
              text,count=re.subn(r'(?=<script\s+src=[\"\']src/renderer\.js)', '<script src="src/kernel.js"></script>\n', text,count=1)
              if count!=1: raise SystemExit('Renderer script anchor was not found')
          if 'src/kernel-ui.js' not in text:
              text,count=re.subn(r'(?=<script\s+src=[\"\']src/app\.js)', '<script src="src/kernel-ui.js"></script>\n', text,count=1)
              if count!=1: raise SystemExit('Application script anchor was not found')
          index.write_text(text)
          app=root/'src/app.js'; text=app.read_text()
          if 'installKernelUI' not in text:
              anchor='K.installAdvancedUI?.(App);'
              if anchor not in text: raise SystemExit('Application extension anchor was not found')
              text=text.replace(anchor,anchor+'\n  K.installKernelUI?.(App);',1)
              app.write_text(text)
          for name in ['src/io-worker.js','tools/build.py']:
              path=root/name; text=path.read_text()
              if 'kernel' not in text:
                  for suffix in ['.js','']:
                      pattern=r'([\"\'])production'+re.escape(suffix)+r'\1'
                      text,count=re.subn(pattern,lambda m:m[0]+', '+repr('kernel'+suffix),text,count=1)
                      if count: break
                  else: raise SystemExit('Worker build anchor was not found in '+name)
                  path.write_text(text)
          stage=root/'tools/stage_site.py'; text=stage.read_text()
          if "'.transfer'" not in text: text=text.replace("'.import',", "'.import', '.transfer',",1)
          text=text.replace("('src', 'examples', 'previews')", "('src', 'examples', 'previews', 'docs')")
          stage.write_text(text)
          # These files only transported/recovered source; do not publish their payloads.
          (root/'tools/native-kernel-recovery.py').unlink(missing_ok=True)
          (root/'native-source-recovery.json').unlink(missing_ok=True)
          print('Native source, worker, server route, editor hooks and packaging are integrated.')
          PY
      - name: Commit the readable integration before testing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m 'feat: integrate optional native OpenCascade solids and STEP exchange'
          git push origin HEAD:feature/native-brep-solids
      - name: Install test dependencies and the actual native engine
        run: |
          python3 -m pip install -r requirements-dev.txt -r requirements-kernel.txt
          python3 -m playwright install --with-deps chromium
          python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Verify native operations, browser integration and existing drafting behavior
        run: |
          python3 tools/verify.py --previews
          node tests/kernel-client.test.js
          python3 tests/kernel.test.py
          python3 tests/advanced.browser.py
          python3 tools/build.py
          python3 tools/update_manifest.py
      - name: Commit regenerated assets and successful test reports
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          path=pathlib.Path('.transfer')
          if path.exists(): shutil.rmtree(path)
          for name in ['recover-native-source.yml','complete-native-solids.yml']:
              pathlib.Path('.github/workflows',name).unlink(missing_ok=True)
          PY
          git add --all
          git diff --cached --quiet || git commit -m 'test: verify native solids and rebuild the portable editor'
          git push origin HEAD:feature/native-brep-solids
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require clean-checkout CI on the exact final source
        run: |
          gh workflow run verify.yml --ref feature/native-brep-solids
          run=''
          for attempt in $(seq 1 40); do
            run=$(gh run list --workflow verify.yml --branch feature/native-brep-solids --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -1)
            [ -n "$run" ] && break
            sleep 3
          done
          [ -n "$run" ] || { echo 'Clean-checkout verification did not start'; exit 1; }
          gh run watch "$run" --exit-status
          echo "VERIFICATION_RUN=$run" >> "$GITHUB_ENV"
      - name: Open and merge only the verified native-solid PR
        run: |
          number=$(gh pr list --head feature/native-brep-solids --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --head feature/native-brep-solids --base main --title 'feat: native OpenCascade B-rep solids and STEP exchange' --body "Adds an optional local OpenCascade/CadQuery kernel with retained BREP geometry, curved primitives, profile operations, Boolean solids, topology-index fillet/chamfer/shell, sections and STEP/IGES/BREP/STL exchange. Integrates undo, persistence, display tessellation and a same-origin bounded worker. Clean-checkout verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN . This is OpenCascade, not ACIS; SAT/SAB and arbitrary lossless DWG editing are not claimed. IGES may contain surfaces rather than closed solids. The engine requires the local server; GitHub Pages can display saved tessellation but cannot run Python."
            number=$(gh pr list --head feature/native-brep-solids --base main --state open --json number --jq '.[0].number // empty')
          fi
          [ -n "$number" ] || { echo 'Could not open the feature PR'; exit 1; }
          gh pr merge "$number" --squash --match-head-commit "$SOURCE_SHA"
          echo "Merged verified native-solid PR #$number at source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
