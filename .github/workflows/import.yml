name: Import application package

on:
  push:
    branches: [main]
    paths: ['.import/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-kestrel-cad
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify and unpack source package
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, zipfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.import/manifest.json').read_text())
          encoded = ''.join((root / '.import' / name).read_text().strip() for name in manifest['parts'])
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == manifest['sha256'], 'Package checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(lzma.decompress(compressed))) as archive:
              assert len(archive.infolist()) == len(manifest['files']), 'File count mismatch'
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts, entry.filename
                  assert path.parts[0] not in ('.git', '.github', '.import'), entry.filename
                  data = archive.read(entry)
                  assert hashlib.sha256(data).hexdigest() == manifest['files'][entry.filename], entry.filename
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print(f"Verified and unpacked {len(manifest['files'])} source files.")
          PY
      - name: Install test-only dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print('CHROMIUM_PATH=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Build, test, and regenerate published assets
        run: |
          mkdir -p examples tests/results
          python3 tools/build.py
          node tests/core.test.js
          python3 tests/server.test.py
          python3 tests/browser.test.py
          python3 tests/dxf_interop.py
          python3 tools/capture_previews.py
          chmod +x start.sh
          python3 tools/update_manifest.py
      - name: Commit the verified application
        run: |
          rm -rf .import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "feat: import Kestrel CAD 2D/3D editor with verified source and examples"
          git push origin HEAD:main
          echo "Application commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
