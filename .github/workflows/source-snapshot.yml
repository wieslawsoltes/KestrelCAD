name: Diagnostic source snapshot
on:
  push:
    branches: [feature/native-brep-solids]
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source and Git objects without credentials
        run: |
          git archive HEAD -o /tmp/kestrel-source.tar
          git bundle create /tmp/kestrel-source.bundle --all
          git rev-parse HEAD > /tmp/kestrel-source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-source
          path: |
            /tmp/kestrel-source.tar
            /tmp/kestrel-source.bundle
            /tmp/kestrel-source.sha
          retention-days: 1
