name: Complete parametric sketch integration
on:
  push:
    branches: [feature/parametric-sketch-constraints]
    paths: ['.github/workflows/complete-parametric-sketches.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: complete-parametric-sketches
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/parametric-sketch-constraints
          fetch-depth: 0
      - name: Finish the preceding native-solid PR only if its exact source passes CI
        run: |
          number=$(gh pr list --head feature/native-brep-solids --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo 'No open native-solid PR needs merging in this step.'
            exit 0
          fi
          sha=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          complete=true
          for path in src/kernel.js src/kernel-ui.js tools/kernel.py tests/kernel.test.py tests/advanced.browser.py; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$sha" --jq .sha >/dev/null || complete=false
          done
          if [ "$complete" != true ]; then
            echo '::warning::Native source is still incomplete; its PR is left unmerged.'
            exit 0
          fi
          gh workflow run verify.yml --ref feature/native-brep-solids
          run=''
          for attempt in $(seq 1 40); do
            run=$(gh run list --workflow verify.yml --branch feature/native-brep-solids --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -1)
            [ -n "$run" ] && break
            sleep 3
          done
          [ -n "$run" ] || { echo 'Native verification did not start'; exit 1; }
          gh run watch "$run" --exit-status
          gh pr merge "$number" --squash --match-head-commit "$sha"
          echo "Merged preceding native-solid PR #$number after clean verification $run." >> "$GITHUB_STEP_SUMMARY"
      - name: Incorporate the current main branch and install feature modules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 tools/install_parametrics.py
          python3 - <<'PY'
          from pathlib import Path
          stage=Path('tools/stage_site.py')
          text=stage.read_text().replace("('src', 'examples', 'previews')", "('src', 'examples', 'previews', 'docs')")
          if "'.transfer'" not in text:
              text=text.replace("'.import',", "'.import', '.transfer',",1)
          stage.write_text(text)
          readme=Path('README.md')
          text=readme.read_text()
          if 'docs/PARAMETRIC-SKETCHES.md' not in text:
              text += '\n\n## Parametric sketch editing\n\nThe Parametric button and command palette expose geometric constraints, driving dimensions, named expressions, conflict rollback and degrees-of-freedom diagnostics. See [Parametric sketches](docs/PARAMETRIC-SKETCHES.md) for supported planar geometry, commands, persistence and numerical limits. This is not a general 3D assembly solver or lossless AutoCAD constraint interchange.\n'
          readme.write_text(text)
          PY
          git add --all
          git diff --cached --quiet || git commit -m 'feat: integrate atomic parametric sketch editing into browser and worker builds'
          git push origin HEAD:feature/parametric-sketch-constraints
      - name: Install actual verification dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          if [ -f requirements-kernel.txt ]; then python3 -m pip install -r requirements-kernel.txt; fi
          python3 -m playwright install --with-deps chromium
          python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Test numerical solutions, document editing and the served browser application
        run: |
          node tests/constraints.test.js
          python3 tools/verify.py --previews
          python3 tests/constraints.browser.py
          python3 tools/build.py
      - name: Commit rebuilt application and actual test reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/complete-parametric-sketches.yml').unlink(missing_ok=True)
          PY
          python3 tools/update_manifest.py
          git add --all
          git diff --cached --quiet || git commit -m 'test: verify driving constraints, rollback, undo and native downloads'
          git push origin HEAD:feature/parametric-sketch-constraints
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require clean-checkout CI on the final commit
        run: |
          gh workflow run verify.yml --ref feature/parametric-sketch-constraints
          run=''
          for attempt in $(seq 1 40); do
            run=$(gh run list --workflow verify.yml --branch feature/parametric-sketch-constraints --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -1)
            [ -n "$run" ] && break
            sleep 3
          done
          [ -n "$run" ] || { echo 'Clean-checkout verification did not start'; exit 1; }
          gh run watch "$run" --exit-status
          echo "VERIFICATION_RUN=$run" >> "$GITHUB_ENV"
      - name: Open or update the feature PR and merge only the verified head
        run: |
          number=$(gh pr list --head feature/parametric-sketch-constraints --base main --state open --json number --jq '.[0].number // empty')
          body="Adds a plain-JavaScript planar sketch solver with safe named expressions, geometric constraints, driving dimensions, numerical rank/DOF diagnostics, native persistence, and atomic conflict rollback/undo. Browser and worker integration are installed. Clean-checkout verification on source $SOURCE_SHA: https://github.com/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN . See docs/PARAMETRIC-SKETCHES.md for supported lines/straight polylines/circles, selection workflows, resource bounds and numerical limitations. This is not a general 3D assembly solver or lossless AutoCAD constraint-object interchange."
          if [ -z "$number" ]; then
            gh pr create --head feature/parametric-sketch-constraints --base main --title 'feat: planar sketch constraints and named driving parameters' --body "$body"
            number=$(gh pr list --head feature/parametric-sketch-constraints --base main --state open --json number --jq '.[0].number // empty')
          else
            gh pr edit "$number" --body "$body"
          fi
          [ -n "$number" ] || { echo 'Feature PR could not be resolved'; exit 1; }
          gh pr merge "$number" --squash --match-head-commit "$SOURCE_SHA"
          echo "Merged sketch-constraint PR #$number at verified source $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Explicitly publish the merged main branch
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh workflow run pages.yml --ref main
          run=''
          for attempt in $(seq 1 40); do
            run=$(gh run list --workflow pages.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$sha\") | .databaseId" | head -1)
            [ -n "$run" ] && break
            sleep 3
          done
          [ -n "$run" ] || { echo 'Pages deployment did not start'; exit 1; }
          gh run watch "$run" --exit-status
          echo "Pages deployment $run completed for main commit $sha." >> "$GITHUB_STEP_SUMMARY"
