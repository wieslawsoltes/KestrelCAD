name: Recover interrupted native-solid source
on:
  push:
    branches: [feature/native-brep-solids]
    paths: ['.github/workflows/recover-native-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Recover complete patch entries from the retained transfer
        run: |
          python3 - <<'PY'
          import base64, lzma, pathlib, re, subprocess, json
          root=pathlib.Path.cwd()
          parts=sorted((root/'.transfer').glob('part-*.b64'))
          if not parts:
              raise SystemExit('Retained transfer parts are missing; no source was changed.')
          encoded=''.join(p.read_text().strip() for p in parts)
          raw=base64.b64decode(encoded,validate=True)
          decoder=lzma.LZMADecompressor()
          patch=decoder.decompress(raw)
          blocks=re.split(br'(?=^diff --git )',patch,flags=re.M)
          recovered=[]; incomplete=[]
          allowed={'README.md','docs/NATIVE-SOLIDS.md','index.html','requirements-kernel.txt','src/app.js','src/io-worker.js','src/kernel-ui.js','src/kernel.js','tests/advanced.browser.py','tests/kernel-client.test.js','tests/kernel.test.py','tools/build.py','tools/kernel.py','tools/serve.py','tools/stage_site.py','tools/verify.py'}
          for block in blocks:
              if not block.strip(): continue
              header=block.splitlines()[0].decode()
              match=re.fullmatch(r'diff --git a/(\S+) b/(\S+)',header)
              if not match or match[1]!=match[2] or match[1] not in allowed:
                  raise SystemExit('Unexpected source-transfer path: '+header)
              name=match[1]
              check=subprocess.run(['git','apply','--check','-'],input=block,capture_output=True)
              if check.returncode==0:
                  subprocess.run(['git','apply','--whitespace=nowarn','-'],input=block,check=True)
                  recovered.append(name)
              else:
                  reverse=subprocess.run(['git','apply','--reverse','--check','-'],input=block,capture_output=True)
                  if reverse.returncode==0: recovered.append(name)
                  else: incomplete.append({'path':name,'reason':check.stderr.decode()[:1000]})
          report={'complete_archive':decoder.eof,'parts':len(parts),'recovered_files':recovered,'incomplete_entries':incomplete,'not_recovered':sorted(allowed-set(recovered)),'status':'Recovery only; no tests, PR merge or deployment asserted.'}
          (root/'native-source-recovery.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve recovered readable source on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m 'chore: recover readable native-solid source from interrupted transfer'
          git push origin HEAD:feature/native-brep-solids
