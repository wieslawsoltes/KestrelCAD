name: Apply checksum-verified feature source

on:
  push:
    branches: ['feature/**']
    paths: ['.transfer/manifest.json']

permissions:
  contents: write

concurrency:
  group: source-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check hashes and expand the reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          spec = json.loads((root / '.transfer/manifest.json').read_text())
          encoded = ''.join((root / '.transfer' / name).read_text().strip() for name in spec['parts'])
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == spec['sha256'], 'Transfer checksum mismatch'
          patch = lzma.decompress(data)
          assert len(patch) <= 4 * 1024 * 1024, 'Oversized source patch'
          patch_path = root / '.transfer/change.patch'
          patch_path.write_bytes(patch)
          changed = subprocess.check_output(['git', 'apply', '--numstat', str(patch_path)], text=True)
          for row in changed.splitlines():
              name = row.split('\t')[-1]
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts, name
              assert path.parts[0] not in ('.git', '.github', '.transfer'), name
          for name, expected in spec['base'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, 'Baseline changed: ' + name
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=nowarn', str(patch_path)], check=True)
          for name, expected in spec['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, 'Expanded source checksum mismatch: ' + name
          print('Applied checksum-verified source. Functional tests run separately in PR CI.')
          PY
      - name: Rebuild the standalone editor and commit readable source
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 tools/build.py
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: apply checksum-verified feature implementation'
          git push origin "HEAD:$BRANCH"
          echo "Source commit: $(git rev-parse HEAD). Functional validation is required in PR CI." >> "$GITHUB_STEP_SUMMARY"
