name: Verified drafting continuation

on:
  push:
    branches: [feature/productivity-tools-20260908]
    paths: [.github/workflows/productivity-integration.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestrel-productivity-continuation
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/KestrelCAD' && github.ref == 'refs/heads/feature/productivity-tools-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the explicitly requested feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install the existing complete verification dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt -r requirements-kernel.txt
          python3 -m playwright install --with-deps chromium
          python3 -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print('CHROMIUM_PATH=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Support either filename or module-stem source lists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/integrate_productivity.py')
          text = path.read_text()
          old = """            if value.split('/')[-1] != 'app.js':
                          continue
                      prefix = value[:-len('app.js')]
                      if prefix + 'productivity.js' in strings:
                          continue
                      offset = offsets[element.lineno - 1] + element.col_offset
                      insertion = (repr(prefix + 'productivity.js') + ', ' + repr(prefix + 'productivity-ui.js') + ', ').encode('utf-8')"""
          # Leave the known filename-list implementation unchanged when its
          # exact block does not match; integration will still fail closed.
          old = old.replace('                      ', '            ').replace('                          ', '                ')
          new = """            leaf = value.split('/')[-1]
                      if leaf not in ('app.js', 'app'):
                          continue
                      prefix = value[:-len(leaf)]
                      suffix = '.js' if leaf.endswith('.js') else ''
                      if prefix + 'productivity' + suffix in strings:
                          continue
                      offset = offsets[element.lineno - 1] + element.col_offset
                      insertion = (repr(prefix + 'productivity' + suffix) + ', ' + repr(prefix + 'productivity-ui' + suffix) + ', ').encode('utf-8')"""
          new = new.replace('                      ', '            ').replace('                          ', '                ')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify reviewed blocker fix, integrate, test, open-check and merge
        run: python3 tools/finish_productivity.py
      - name: Preserve exact readable source and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-evidence
          path: ${{ runner.temp }}/kestrel-continuation-evidence
          retention-days: 14
          if-no-files-found: warn
